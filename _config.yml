title: Inazira Skincare
description: Clear, evidence-informed information about skin conditions, symptoms, treatments, ingredients and everyday skincare.
url: "https://skincare.inazira.com"
baseurl: ""

markdown: kramdown
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
