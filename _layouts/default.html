<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <div class="site-wrap">
    <header class="site-header">
      <div class="eyebrow-row">
        <span class="eyebrow-line left"></span>
        <span class="eyebrow-text">INAZIRA</span>
        <span class="eyebrow-line right"></span>
      </div>
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">Inazira Skin Care</a></h1>
      <p class="site-description">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/tags/' | relative_url }}">Tags</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://inazira.com">INAZIRA Tools</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-divider"></div>
      <p class="footer-text">&copy; {{ 'now' | date: "%Y" }} INAZIRA. All Rights Reserved.</p>
    </footer>
  </div>
</body>
</html>
